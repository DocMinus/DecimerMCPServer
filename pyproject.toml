[project]
name = "decimer-mcp-server"
version = "0.1.4"
description = "MCP adapter server for DECIMER FastAPI image-to-SMILES endpoint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/DocMinus/DecimerMCPServer"
Repository = "https://github.com/DocMinus/DecimerMCPServer"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
decimer-mcp-server = "decimer_mcp_server.__main__:main"
decimer-mcp-smoke-test = "decimer_mcp_server.smoke_test:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
