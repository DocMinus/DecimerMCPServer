name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: |
          pip install --quiet jsonschema
          python - <<'PY'
          import json, jsonschema, urllib.request
          schema = json.loads(urllib.request.urlopen(
              'https://static.modelcontextprotocol.io/schemas/2025-09-29/server.schema.json'
          ).read())
          data = json.load(open('server.json'))
          jsonschema.validate(data, schema)
          print('server.json valid')
          PY

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
