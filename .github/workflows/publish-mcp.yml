name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (optional, defaults to main)'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install mcp-publisher CLI
        run: |
          go install github.com/modelcontextprotocol/registry/cmd/publisher@latest

      - name: Validate server.json
        run: |
          pip install jsonschema
          python - <<'PY'
          import json
          import jsonschema
          import urllib.request

          schema = json.loads(
              urllib.request.urlopen(
                  'https://static.modelcontextprotocol.io/schemas/2025-09-29/server.schema.json'
              ).read()
          )
          data = json.load(open('server.json'))
          jsonschema.validate(data, schema)
          print('✅ server.json valid!')
          PY

      - name: Login to MCP Registry
        env:
          MCP_REGISTRY_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
        run: |
          mcp-publisher login github --token "$MCP_REGISTRY_TOKEN"

      - name: Publish to Registry
        run: |
          mcp-publisher publish --file server.json
