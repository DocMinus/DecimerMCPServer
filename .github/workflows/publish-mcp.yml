name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install mcp-publisher CLI
        run: |
          go install github.com/modelcontextprotocol/registry/cmd/publisher@latest

      - name: Validate server.json
        run: |
          pip install jsonschema
          python -c "
import json, jsonschema, urllib.request
schema = json.loads(urllib.request.urlopen('https://static.modelcontextprotocol.io/schemas/2025-09-29/server.schema.json').read())
data = json.load(open('server.json'))
jsonschema.validate(data, schema)
print('✅ server.json valid!')
"

      - name: Publish to Registry
        env:
          GITHUB_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
        run: |
          mcp-publisher publish --file server.json
