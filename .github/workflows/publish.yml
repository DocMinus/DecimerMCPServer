name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validate server.json
        run: |
          uv pip install jsonschema
          python -c "
import json, jsonschema, urllib.request
schema = json.loads(urllib.request.urlopen('https://static.modelcontextprotocol.io/schemas/2025-09-29/server.schema.json').read())
data = json.load(open('server.json'))
jsonschema.validate(data, schema)
print('server.json valid!')
"

      - name: Publish to Registry
        uses: modelcontextprotocol/registry-action@v1
        with:
          server-json-path: ./server.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
